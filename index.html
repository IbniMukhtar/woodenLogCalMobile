<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timber Logs Manager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
body { background:#f5f7fa; padding-bottom:100px; font-family:Segoe UI; }
.card-custom{ background:#fff; border-radius:15px; padding:16px; margin-bottom:15px; box-shadow:0 3px 8px rgba(0,0,0,0.1); }
.log-row{ display:flex; justify-content:space-between; align-items:center; background:white; padding:10px; margin-bottom:8px; border-radius:10px; border:1px solid #ddd; }
.log-row.pinned{ border:2px solid #0ea5e9; background:#e0f5ff; }
.quick-girth-btn { padding:8px 13px; background:#f0f0f0; border-radius:8px; border:1px solid #ddd; font-size:0.9rem; }
.quick-girth-btn:active{ background:#d0e9ff; }
.bottom-nav{ position:fixed; bottom:0; left:0; right:0; height:70px; background:white; border-top:1px solid #ccc; display:flex; justify-content:space-around; align-items:center; box-shadow:0 -2px 6px rgba(0,0,0,0.12); }
.bottom-nav button{ background:none; border:none; color:#444; font-size:0.85rem; text-align:center; }
.bottom-nav button i{ font-size:1.3rem; display:block; }
</style>
</head>
<body>

<div class="app-header text-center p-3 text-white" style="background:linear-gradient(135deg,#3b82f6,#9333ea);border-bottom-left-radius:20px;border-bottom-right-radius:20px;">
     <h2>🪵 Wooden Log Volume Calculator</h2>
      <p>Calculate and track the volume of your wooden logs with precision</p>
</div>

<div class="container">

<!-- SUPPLIER -->
<div class="card card-custom">
    <h5><i class="bi bi-person-badge"></i> Supplier</h5>
    <input id="supplierName" class="form-control mb-2" placeholder="Supplier Name *">
    <input id="vehicleNumber" class="form-control mb-2" placeholder="Vehicle Number *">
    <input id="driverName" class="form-control mb-2" placeholder="Driver Name *">
    <select id="logType" class="form-select mb-3">
        <option value="">Log Type (optional)</option>
        <option>Fras</option>
        <option>Brran</option>
        <option>Yedd</option>
    </select>
    <div class="d-flex gap-2">
        <button class="btn btn-success w-50" id="saveSupplierBtn">Save</button>
        <button class="btn btn-warning w-50" id="editSupplierBtn" disabled>Edit</button>
    </div>
</div>

<!-- HEIGHT -->
<div class="card card-custom">
    <h5><i class="bi bi-arrows-fullscreen"></i> Log Height</h5>
    <div class="row g-2">
        <div class="col-6"><select id="heightFeet" class="form-select"><option value="">Feet</option></select></div>
        <div class="col-6"><select id="heightInches" class="form-select"><option value="">Inches</option></select></div>
    </div>
    <button class="btn btn-primary w-100 mt-3" id="applyHeightBtn">Apply Height</button>
    <div class="alert alert-info text-center mt-3 selected-height-card">Current Height: --</div>
</div>

<!-- QUICK GIRTH ENTRY -->
<div class="card card-custom">
    <h5><i class="bi bi-rulers"></i> Add Log</h5>
    <div class="d-flex gap-2 flex-wrap mb-2" id="quickGirthContainer"></div>
    <input type="number" id="girthInput" class="form-control mb-3" placeholder="Enter girth (inches)">
    <button class="btn btn-success w-100" id="addLogBtn">Add Log</button>
</div>

<!-- LOGS -->
<div class="card card-custom">
    <h5><i class="bi bi-table"></i> Logs</h5>
    <div id="logsContainer"></div>
</div>

<!-- TOTAL VOLUME CARD -->
<div class="card card-custom">
    <h5><i class="bi bi-cash-stack"></i> Total Volume</h5>
    <h3 id="totalVolume" class="text-success">0</h3>
</div>

<!-- SUMMARY -->
<div class="card card-custom" id="summaryCard">
    <h5><i class="bi bi-graph-up"></i> Summary</h5>
    <table class="table table-sm">
        <tr><th>Total Logs</th><td id="sumCount">0</td></tr>
        <tr><th>Total Volume</th><td id="sumVolume">0</td></tr>
        <tr><th>Average Girth</th><td id="sumAvgGirth">0</td></tr>
        <tr><th>Max Girth</th><td id="sumMaxGirth">0</td></tr>
        <tr><th>Min Girth</th><td id="sumMinGirth">0</td></tr>
    </table>
</div>

</div>

<!-- BOTTOM NAV WITH PDF BUTTON -->
<div class="bottom-nav">
    <button onclick="scrollToTop()"><i class="bi bi-house"></i>Home</button>
    <button onclick="goToLogs()"><i class="bi bi-list-ul"></i>Logs</button>
    <button onclick="goToSummary()"><i class="bi bi-bar-chart"></i>Summary</button>
    <button id="downloadPdfBtn"><i class="bi bi-file-earmark-pdf"></i>PDF</button>
</div>

<script>
let logs=[]; 
let currentHeight=null; 
let supplierSaved=false; 
let heightApplied=false;

/* Populate Feet/Inches */
for(let i=1;i<=30;i++) heightFeet.innerHTML+=`<option>${i}</option>`;
for(let i=0;i<12;i++) heightInches.innerHTML+=`<option>${i}</option>`;

/* Supplier Save/Edit */
saveSupplierBtn.onclick=()=>{
    if(!supplierName.value||!vehicleNumber.value||!driverName.value){ alert("Fill all supplier fields"); return; }
    supplierName.disabled=true; vehicleNumber.disabled=true; driverName.disabled=true; logType.disabled=true;
    editSupplierBtn.disabled=false; saveSupplierBtn.disabled=true;
    supplierSaved=true;
};
editSupplierBtn.onclick=()=>{
    supplierName.disabled=false; vehicleNumber.disabled=false; driverName.disabled=false; logType.disabled=false;
    saveSupplierBtn.disabled=false;
    supplierSaved=false;
};

/* Quick girth buttons */
const quickGirthContainer = document.getElementById("quickGirthContainer");
for(let g=18; g<=45; g++){
    const btn = document.createElement("button");
    btn.className="quick-girth-btn";
    btn.textContent=g;
    btn.disabled=true;
    btn.onclick=()=> setCommon(g);
    quickGirthContainer.appendChild(btn);
}
function setQuickButtons(enabled){
    quickGirthContainer.querySelectorAll("button").forEach(b=>b.disabled=!enabled);
}
function setCommon(v){ girthInput.value=v; }

/* Detect height change */
heightFeet.onchange = heightInches.onchange = ()=>{
    if(currentHeight){
        heightApplied=false;
        document.querySelector(".selected-height-card").textContent="Height changed! Apply to continue";
        girthInput.disabled=true;
        addLogBtn.disabled=true;
        setQuickButtons(false);
    }
};

/* Apply height */
applyHeightBtn.onclick=()=>{
    if(!heightFeet.value){ alert("Select height"); return; }
    currentHeight={feet:parseInt(heightFeet.value), inches:parseInt(heightInches.value||0)};
    document.querySelector(".selected-height-card").textContent=`Current Height: ${currentHeight.feet}' ${currentHeight.inches}"`;
    heightApplied=true;
    girthInput.disabled=false;
    addLogBtn.disabled=false;
    setQuickButtons(true);
};

/* Volume calculation */
function calculateVolume(g,f,i){ let ht=f+i/12; let q=g/4; return Math.round(((q*q)/144)*ht*100)/100; }

/* Add log */
function addLog(){
    if(!currentHeight){ alert("Apply height first"); return; }
    let g=parseFloat(girthInput.value); if(!g){ alert("Enter girth"); return; }
    logs.push({pinned:false,feet:currentHeight.feet,inches:currentHeight.inches,girth:g,volume:calculateVolume(g,currentHeight.feet,currentHeight.inches)});
    girthInput.value="";
    renderLogs(); updateSummary();
}
addLogBtn.onclick=addLog;

/* Render logs */
function renderLogs(){
    logsContainer.innerHTML="";
    logs.forEach((l,i)=>{
        let row=document.createElement("div");
        row.className="log-row "+(l.pinned?"pinned":"");
        row.innerHTML=`<div><b>${l.feet}' ${l.inches}"</b> | G: ${l.girth} | V: ${l.volume}</div>
        <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" onclick="editLog(${i})"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteLog(${i})"><i class="bi bi-trash"></i></button>
        <button class="btn btn-sm btn-outline-warning" onclick="togglePin(${i})"><i class="bi bi-pin"></i></button>
        </div>`;
        logsContainer.appendChild(row);
    });
}

/* Delete */
function deleteLog(i){ logs.splice(i,1); renderLogs(); updateSummary(); }

/* Pin highlight */
function togglePin(i){ logs[i].pinned=!logs[i].pinned; renderLogs(); }

/* Edit popup */
function editLog(i){
    let l=logs[i];
    let popup=document.createElement("div");
    popup.innerHTML=`<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;">
    <div style="background:#fff;padding:20px;border-radius:10px;width:90%;max-width:300px;">
    <h5>Edit Log</h5>
    <input id="editFeet" class="form-control mb-2" placeholder="Feet" value="${l.feet}">
    <input id="editInches" class="form-control mb-2" placeholder="Inches" value="${l.inches}">
    <input id="editGirth" class="form-control mb-2" placeholder="Girth" value="${l.girth}">
    <div class="d-flex gap-2">
    <button class="btn btn-success w-50" id="saveEditBtn">Save</button>
    <button class="btn btn-secondary w-50" id="cancelEditBtn">Cancel</button>
    </div>
    </div></div>`;
    document.body.appendChild(popup);
    document.getElementById("cancelEditBtn").onclick=()=>popup.remove();
    document.getElementById("saveEditBtn").onclick=()=>{
        l.feet=parseInt(document.getElementById("editFeet").value);
        l.inches=parseInt(document.getElementById("editInches").value);
        l.girth=parseFloat(document.getElementById("editGirth").value);
        l.volume=calculateVolume(l.girth,l.feet,l.inches);
        popup.remove(); renderLogs(); updateSummary();
    };
}

/* Summary */
function updateSummary(){
    let count=logs.length; let volume=logs.reduce((s,l)=>s+l.volume,0);
    sumCount.textContent=count; sumVolume.textContent=volume.toFixed(2); totalVolume.textContent=volume.toFixed(2);
    let girths=logs.map(l=>l.girth);
    sumAvgGirth.textContent=count?(girths.reduce((a,b)=>a+b,0)/count).toFixed(2):0;
    sumMaxGirth.textContent=count?Math.max(...girths):0;
    sumMinGirth.textContent=count?Math.min(...girths):0;
}

/* PDF export */
downloadPdfBtn.onclick=()=>{
    if(!supplierSaved){ alert("Save supplier details first"); return; }
    if(logs.length==0){ alert("Add at least one log before exporting"); return; }

    const { jsPDF } = window.jspdf;
    const doc=new jsPDF(); let y=20;

    doc.setFontSize(16); doc.text("Bhat Wood and Timber Suppliers",105,y,{align:'center'}); y+=7;
    doc.setFontSize(12); doc.text("Prop. Mukhtar Ahmad Bhat",105,y,{align:'center'}); y+=6;
    doc.text("Contact: 9596663402",105,y,{align:'center'}); y+=6;
    doc.text("Banimullah Kulgam, J&K",105,y,{align:'center'}); y+=10;

    doc.text(`Supplier: ${supplierName.value}`,14,y);
    doc.text(`Vehicle: ${vehicleNumber.value}`,130,y); y+=6;
    doc.text(`Driver: ${driverName.value}`,14,y);
    doc.text(`Log Type: ${logType.value||"N/A"}`,130,y); y+=6;
    doc.text(`Date: ${new Date().toLocaleDateString()}`,14,y); y+=10;

    const rows=logs.map((l,i)=>[i+1,`${l.feet}' ${l.inches}"`,l.girth,l.volume]);
    doc.autoTable({startY:y,head:[["S.No","Height","Girth","Volume"]],body:rows});
    y=doc.lastAutoTable.finalY+10;
    doc.text(`Total Volume: ${totalVolume.textContent} cu.ft`,14,y);

    doc.save("timber_logs.pdf");
};

/* Navigation */
function scrollToTop(){ window.scrollTo({top:0,behavior:"smooth"}); }
function goToLogs(){ logsContainer.scrollIntoView({behavior:"smooth"}); }
function goToSummary(){ summaryCard.scrollIntoView({behavior:"smooth"}); }

</script>
</body>
</html>
